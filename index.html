<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Даша Купцова — тестовое задание в Альфа-Банк</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Дизайн-процесс в Альфа-Бизнес: обложка, ресайз и схема — два варианта">
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="fonts/GolosText-500-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="al.css">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<!-- скелет загрузки: виден сразу, пока грузятся стили и код -->
<div id="al-skel" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(16px,4vw,64px) clamp(16px,3vw,40px);transition:opacity .5s,visibility .5s">
<style>#al-skel i{display:block;border-radius:4px;background:linear-gradient(100deg,#F2F2F3 30%,#FAFAFA 50%,#F2F2F3 70%);background-size:220% 100%;animation:al-sk 1.3s linear infinite}@keyframes al-sk{from{background-position:120% 0}to{background-position:-120% 0}}#al-skel.off{opacity:0;visibility:hidden}</style>
<i style="width:min(260px,50%);height:20px;margin-bottom:28px"></i>
<i style="width:86%;height:clamp(40px,7vw,120px);margin-bottom:12px"></i>
<i style="width:64%;height:clamp(40px,7vw,120px);margin-bottom:clamp(32px,5vw,72px)"></i>
<i style="width:100%;height:clamp(200px,40vw,560px)"></i>
</div>
<div id="al" class="al"></div>
<!-- страховка: если код не загрузился или упал, скелет не висит вечно -->
<script>setTimeout(function(){var k=document.getElementById('al-skel');if(k&&!document.getElementById('al').children.length){k.innerHTML='<p style="font:500 20px/1.4 system-ui,sans-serif;color:#121314;max-width:30ch;margin:0 0 40vh">Страница не загрузилась. Обновите ее, пожалуйста</p>';k.style.justifyContent='center';}},9000)</script>
<script src="al.js" defer></script>
</body>
</html>
