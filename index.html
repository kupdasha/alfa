<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Даша Купцова — тестовое задание в Альфа-Банк</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Дизайн-процесс в Альфа-Бизнес: обложка, ресайз и схема — два варианта">
<meta name="theme-color" content="#ffffff">
<!-- файлы страницы идут с jsDelivr (воркер ставит <base>): соединение с ним открываем сразу, не дожидаясь первого файла -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" href="fonts/GolosText-500-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<!-- запасной источник: если файл с jsDelivr не пришел (его блокируют), страница переключается на копию с воркера (workers.dev) -->
<script>window.alFallback=function(){if(window.alFell)return;window.alFell=1;var b=document.querySelector('base'),o='https://kup-version.kupdaria26.workers.dev/alfa/';if(b)b.href=o;var l=document.createElement('link');l.rel='stylesheet';l.href=o+'al.css';document.head.appendChild(l);var s=document.createElement('script');s.src=o+'al.js';s.defer=true;document.head.appendChild(s)};</script>
<!-- сторож стоит ВЫШЕ стилей: зависший запрос стилей блокирует все скрипты ниже него. Через 9 с без страницы — запасной источник, еще через 9 с — просьба обновить -->
<script>setTimeout(function(){var k=document.getElementById('al-skel');if(k&&!document.getElementById('al').children.length){if(!window.alFell){alFallback();return setTimeout(arguments.callee,9000)}k.innerHTML='<p style="font:500 20px/1.4 system-ui,sans-serif;color:#121314;max-width:30ch;margin:0 0 40vh">Страница не загрузилась. Обновите ее, пожалуйста</p>';k.style.justifyContent='center';}},9000)</script>
<link rel="stylesheet" href="al.css" onerror="alFallback()">
<style>html,body{margin:0;background:#fff}</style>
</head>
<body>
<!-- скелет загрузки: виден сразу, пока грузятся стили и код -->
<div id="al-skel" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(16px,4vw,64px) clamp(16px,3vw,40px);transition:opacity .5s,visibility .5s">
<style>#al-skel i{display:block;border-radius:4px;background:linear-gradient(100deg,#F2F2F3 30%,#FAFAFA 50%,#F2F2F3 70%);background-size:220% 100%;animation:al-sk 1.3s linear infinite}@keyframes al-sk{from{background-position:120% 0}to{background-position:-120% 0}}#al-skel.off{opacity:0;visibility:hidden}</style>
<i style="width:min(260px,50%);height:20px;margin-bottom:28px"></i>
<i style="width:86%;height:clamp(40px,7vw,120px);margin-bottom:12px"></i>
<i style="width:64%;height:clamp(40px,7vw,120px);margin-bottom:clamp(32px,5vw,72px)"></i>
<i style="width:100%;height:clamp(200px,40vw,560px)"></i>
</div>
<div id="al" class="al"></div>
<script src="al.js" defer onerror="alFallback()"></script>
</body>
</html>
